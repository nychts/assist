<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tipps</title>
<style>
  :root { --gruen: #2a7a3b; --hell: #eef7f0; --text: #1d1d1d; --grau: #666; --rand: #cfe3d4; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
         background: #fafafa; line-height: 1.5; font-size: 18px; }
  main { max-width: 680px; margin: 0 auto; padding: 16px; }
  header p { margin: 0; color: var(--grau); font-size: 0.85em; }
  h1 { font-size: 1.3em; margin: 4px 0 12px; }
  .hinweis { background: #fff8e6; border-left: 4px solid #e0a800; padding: 8px 12px; border-radius: 4px; font-size: 0.9em; }
  .stufe { background: #fff; border: 1px solid var(--rand); border-radius: 8px; margin: 12px 0; overflow: hidden; }
  .stufe button { width: 100%; text-align: left; padding: 14px 16px; font: inherit; font-weight: 600;
                  border: 0; background: var(--hell); color: var(--gruen); cursor: pointer; min-height: 48px; }
  .stufe button:disabled { color: #999; background: #f1f1f1; cursor: not-allowed; }
  .stufe .inhalt { padding: 4px 16px 14px; }
  .stufe .inhalt[hidden] { display: none; }
  code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 0.92em; }
  nav { margin-top: 28px; font-size: 0.9em; }
  nav a { display: inline-block; margin: 4px 8px 4px 0; padding: 6px 10px; border: 1px solid var(--rand);
          border-radius: 6px; color: var(--gruen); text-decoration: none; background: #fff; }
  nav a[aria-current="true"] { background: var(--gruen); color: #fff; }
  .leer { color: var(--grau); }
</style>
</head>
<body>
<main>
  <header><p id="kopf"></p></header>
  <h1 id="titel">Tipps</h1>
  <p class="hinweis">Probiere es zuerst selbst. Decke die Tipps nacheinander auf und arbeite nach jedem Tipp weiter, bevor du den nächsten öffnest.</p>
  <section id="stufen" aria-live="polite"></section>
  <nav id="nav" aria-label="Andere Aufgaben dieser Stunde"></nav>
</main>
<script>
const DATA = {"stunde":{"fach":"informatik","reihe":"inf10-javascript","nr":3,"einheit":"Doppelstunde 3 (Stunde 4–5)","titel":"Die KI baut ein Spiel"},"aufgabe":[{"id":"a1","titel":"Aufgabe 1: PixelBots Spiel testen","tipps":["Solange der Computer zufällig wählt, kannst du einen Testfall nicht gezielt auslösen. Wie hast du in Doppelstunde 1 die Geheimzahl festgelegt?","Suche die Zeile, in der `computer` seinen Wert bekommt, und ersetze den Aufruf von `computerWahl()` vorübergehend durch einen festen Wert, z. B. `let computer = \"Schere\";`. Dann teste alle drei Knöpfe.","Teil b findest du nicht mit festen Werten. Mach die Zeile wieder rückgängig, spiel 15 Runden und führe eine Strichliste, wie oft der Computer Schere, Stein und Papier wählt."]},{"id":"a2","titel":"Aufgabe 2: Fehlerberichte an PixelBot","tipps":["PixelBot korrigiert nur, was du genau beschreibst. Was hast du gewählt, was der Computer, was wurde angezeigt, was ist richtig?","Muster: „Ich wähle Stein, der Computer Schere. Angezeigt wird Verloren, richtig wäre Gewonnen.“ Noch besser mit Zeile: „In ermittleSieger fehlt der Fall …“","Den Fehler aus der Strichliste findest du im Code von `computerWahl()`. Wie viele verschiedene Zahlen kann `Math.floor(Math.random() * n)` liefern?"]},{"id":"a3","titel":"Aufgabe 3: Eine Bedingung für alle Siege","tipps":["Jeder Sieg ist ein Paar: Spieler hat X UND Computer hat Y. Wie schreibt man UND in JavaScript?","Drei Paare, von denen eines stimmen muss: Paar 1 ODER Paar 2 ODER Paar 3. ODER heißt `||`. Klammere jedes Paar.","Anfang: `if ((spieler === \"Schere\" && computer === \"Papier\") || (…) || (…))`"]},{"id":"p1","titel":"Plus 1: Der Computer bekommt Punkte","tipps":["Schau dir an, wie `punkte` angelegt und erhöht wird. `computerPunkte` funktioniert genauso, nur bei einem anderen Ergebnis.","Der Computer punktet, wenn ihr verliert. Die Bedingung lautet `ergebnis === \"Verloren\"`. Erhöhen heißt: neuer Wert = alter Wert + 1.","Die letzte Lücke ist der Wert, der angezeigt werden soll, also die Variable selbst. `let computerPunkte = 0;` gehört nach oben zu `let punkte`, nicht in die Funktion."]},{"id":"p2","titel":"Plus 2: Wer zuerst drei hat","tipps":["Du brauchst zwei Fälle: Ihr habt 3 Punkte, oder der Computer hat 3 Punkte. Das ist eine if / else-if-Kette wie in `ermittleSieger`.","Die Ausgabe kopierst du aus der Zeile mit `getElementById(\"ergebnis\")` und tauschst nur den Text aus.","Erscheint die Meldung nie? Dann steht deine Verzweigung vor der normalen Ergebnis-Anzeige und wird sofort überschrieben. Schiebe sie ans Ende von `spielen()`."]},{"id":"p3","titel":"Plus 3: Eure Erweiterung","tipps":["A: Ein Knopf mit `onclick=\"neuesMatch()\"` sieht aus wie eure Spielknöpfe. Die Funktion schreibst du wie `function spielen(spieler) { }`, nur ohne Parameter. B: `serie` legst du oben neben `punkte` an.","A: In der Funktion `punkte = 0;` schreiben, nicht `let punkte = 0;`. Mit `let` entsteht eine neue Variable und der alte Stand bleibt. B: Bei \"Gewonnen\" `serie = serie + 1;`, in allen anderen Fällen `serie = 0;`.","Vergiss die Anzeige nicht: Nach jeder Änderung einer Variable muss eine `textContent`-Zeile den neuen Wert auf die Seite schreiben. Teste mit festem Computerwert."]}]};
const STUFEN = ["Denkanstoß", "Strategie", "Teillösung", "Kontrolle"];

// Text sicher machen, dann **fett**, `code` und Zeilenumbrüche erlauben.
function formatiere(t) {
  const esc = String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/`(.+?)`/g, "<code>$1</code>")
            .replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>");
}

function zeige() {
  const s = DATA.stunde;
  const id = (location.hash || "").slice(1) || DATA.aufgabe[0].id;
  const a = DATA.aufgabe.find(x => x.id === id) || DATA.aufgabe[0];
  document.getElementById("kopf").textContent = (s.einheit || ("Stunde " + s.nr)) + " · " + s.titel;
  document.getElementById("titel").textContent = a.titel;
  document.title = "Tipps · " + a.titel;

  const box = document.getElementById("stufen");
  box.innerHTML = "";
  const namen = a.stufen || STUFEN;
  a.tipps.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "stufe";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Tipp " + (i + 1) + ": " + (namen[i] || "") + " anzeigen";
    btn.setAttribute("aria-expanded", "false");
    btn.disabled = i > 0;
    const inhalt = document.createElement("div");
    inhalt.className = "inhalt";
    inhalt.hidden = true;
    inhalt.innerHTML = "<p>" + formatiere(t) + "</p>";
    btn.addEventListener("click", () => {
      inhalt.hidden = false;
      btn.setAttribute("aria-expanded", "true");
      btn.textContent = "Tipp " + (i + 1) + ": " + (namen[i] || "");
      const next = box.querySelectorAll(".stufe button")[i + 1];
      if (next) next.disabled = false;
    });
    div.append(btn, inhalt);
    box.append(div);
  });
  if (a.tipps.length === 0) box.innerHTML = '<p class="leer">Zu dieser Aufgabe gibt es keine Tipps.</p>';

  const nav = document.getElementById("nav");
  nav.innerHTML = DATA.aufgabe.length > 1 ? "Andere Aufgaben: " : "";
  if (DATA.aufgabe.length > 1) DATA.aufgabe.forEach(x => {
    const l = document.createElement("a");
    l.href = "#" + x.id;
    l.textContent = x.titel.split(":")[0];
    if (x.id === a.id) l.setAttribute("aria-current", "true");
    nav.append(l);
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", zeige);
zeige();
</script>
</body>
</html>
