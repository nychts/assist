<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Spielfeld</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1e2a38; color: #f4f4f4;
           display: flex; flex-direction: column; align-items: center; padding-top: 40px; }
    h1 { color: #f6b93b; }
    #feld { display: grid; grid-template-columns: repeat(5, 60px); gap: 4px; }
    .zelle { width: 60px; height: 60px; background: #2c3e50; border-radius: 6px;
             display: flex; align-items: center; justify-content: center; color: #9aa7b4; }
    .gemalt { background: #f6b93b; color: #1e2a38; font-weight: bold; }
    .klein { font-size: 0.85em; color: #9aa7b4; }
  </style>
</head>
<body>
  <h1>Spielfeld</h1>
  <div id="feld"></div>
  <p class="klein">Schleifen in schleifen.js ändern, speichern, F5. Fehler stehen in der Konsole (F12).</p>
  <script src="spielfeld.js"></script>
  <script src="schleifen.js"></script>
</body>
</html>
