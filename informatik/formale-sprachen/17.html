<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tipps</title>
<style>
  :root { --gruen: #2a7a3b; --hell: #eef7f0; --text: #1d1d1d; --grau: #666; --rand: #cfe3d4; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
         background: #fafafa; line-height: 1.5; font-size: 18px; }
  main { max-width: 680px; margin: 0 auto; padding: 16px; }
  header p { margin: 0; color: var(--grau); font-size: 0.85em; }
  h1 { font-size: 1.3em; margin: 4px 0 12px; }
  .hinweis { background: #fff8e6; border-left: 4px solid #e0a800; padding: 8px 12px; border-radius: 4px; font-size: 0.9em; }
  .stufe { background: #fff; border: 1px solid var(--rand); border-radius: 8px; margin: 12px 0; overflow: hidden; }
  .stufe button { width: 100%; text-align: left; padding: 14px 16px; font: inherit; font-weight: 600;
                  border: 0; background: var(--hell); color: var(--gruen); cursor: pointer; min-height: 48px; }
  .stufe button:disabled { color: #999; background: #f1f1f1; cursor: not-allowed; }
  .stufe .inhalt { padding: 4px 16px 14px; }
  .stufe .inhalt[hidden] { display: none; }
  code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 0.92em; }
  nav { margin-top: 28px; font-size: 0.9em; }
  nav a { display: inline-block; margin: 4px 8px 4px 0; padding: 6px 10px; border: 1px solid var(--rand);
          border-radius: 6px; color: var(--gruen); text-decoration: none; background: #fff; }
  nav a[aria-current="true"] { background: var(--gruen); color: #fff; }
  .leer { color: var(--grau); }
</style>
</head>
<body>
<main>
  <header><p id="kopf"></p></header>
  <h1 id="titel">Tipps</h1>
  <p class="hinweis">Probiere es zuerst selbst. Decke die Tipps nacheinander auf und arbeite nach jedem Tipp weiter, bevor du den nächsten öffnest.</p>
  <section id="stufen" aria-live="polite"></section>
  <nav id="nav" aria-label="Andere Aufgaben dieser Stunde"></nav>
</main>
<script>
const DATA = {"stunde":{"fach":"informatik","reihe":"formale-sprachen","nr":17,"titel":"Klausurtraining nach Wahl"},"aufgabe":[{"id":"sa","titel":"Station A: Der Zugangscode","stufen":["Denkanstoß","Strategie","Kontrolle"],"tipps":["Was muss sich der Automat beim Lesen merken? Wie viele verschiedene Werte kann das haben?","Je ein Zustand für null, ein und zwei gelesene `b`. Ein `a` ändert daran nichts. Was passiert beim dritten `b`?","Vier Zustände mit Fangzustand, Endzustand ist der Zustand für zwei `b`. `abab` wird akzeptiert, `abbb` landet im Fangzustand."]},{"id":"sb","titel":"Station B: Aus dem NEA wird ein DEA","stufen":["Denkanstoß","Strategie","Kontrolle"],"tipps":["Jeder Zustand des DEA ist eine Menge von NEA-Zuständen. Starte mit `{q0}`.","Schreibe zu jeder neuen Menge auf, wohin alle ihre Elemente bei 0 und bei 1 gehen. Nimm die Vereinigung. Höre auf, wenn keine neue Menge mehr entsteht.","Es entstehen genau drei Mengen: `{q0}`, `{q0, q1}`, `{q0, q2}`. Endzustand ist die Menge mit `q2`."]},{"id":"sc","titel":"Station C: Hausnummern","stufen":["Denkanstoß","Strategie","Kontrolle"],"tipps":["Baue von links nach rechts. An welchen Stellen ändert sich, was als Nächstes erlaubt ist?","Ein Nichtterminal für die weiteren Ziffern, das sich selbst aufrufen darf. Ein zweites für die Situation nach dem `a`, in der nichts mehr kommen darf.","Drei Nichtterminale reichen. Prüfe: `7` und `12a` lassen sich ableiten, `0`, `1a2` und `12aa` nicht."]},{"id":"sd","titel":"Station D: Raumnummern","stufen":["Denkanstoß","Strategie","Kontrolle"],"tipps":["Zerlege die Raumnummer in drei Teile: Buchstabe, Ziffern, Zusatz. Welcher Teil darf fehlen?","Für genau drei Wiederholungen gibt es `{3}`. Eine Gruppe in runden Klammern kannst du mit `?` freiwillig machen.","Dein Ausdruck beginnt mit `^` und endet mit `$`. Teste `A123`, `B007-E`, `A12` und `XA123`: Nur die ersten beiden dürfen passen."]},{"id":"se","titel":"Station E: Reicht ein endlicher Automat?","stufen":["Denkanstoß","Strategie","Kontrolle"],"tipps":["Frage bei jeder Sprache: Bis wohin muss gezählt werden? Gibt es dafür eine feste Obergrenze?","Bei fester Grenze beschreibst du die Zustände. Ohne Grenze nutzt du das Zählargument: mehr Zeichen `a` als Zustände, zwei Anzahlen landen im selben Zustand.","Eine der beiden Sprachen ist regulär, die andere nicht. Dein Widerspruch nutzt zwei Wörter: eines gehört zur Sprache, das andere nicht, und der Automat entscheidet beide gleich."]},{"id":"sf","titel":"Station F: Doppelt so viele","stufen":["Denkanstoß","Strategie","Kontrolle"],"tipps":["Für jedes `a` müssen später zwei `b` kommen. Was könnte der Automat beim Lesen eines `a` auf den Keller legen?","Jedes `a` legt zwei Zeichen `A` auf den Keller, jedes `b` nimmt eines herunter. Der Zustand merkt sich, ob schon ein `b` kam.","Drei Zustände, fünf Übergänge. `abb` endet im Endzustand. Bei `abbb` liegt vor dem letzten `b` das Zeichen `#` oben, dafür gibt es keinen Übergang."]},{"id":"sg","titel":"Station G: Der Keller, der rät","stufen":["Denkanstoß","Strategie","Kontrolle"],"tipps":["Suche in der Tabelle einen Zustand, in dem bei gleicher Situation zwei Übergänge möglich sind. Denke auch an die Zeile mit ε.","In `q0` kann der Automat weiter stapeln oder ohne Lesen nach `q1` wechseln. Probiere den Wechsel nach dem ersten und nach dem zweiten Zeichen.","Der Wechsel nach `a` scheitert beim nächsten `b`. Der Wechsel nach `ab` führt nach `q2`, das Wort ist dann ganz gelesen. Ein solcher Weg reicht."]}]};
const STUFEN = ["Denkanstoß", "Strategie", "Teillösung", "Kontrolle"];

// Text sicher machen, dann **fett**, `code` und Zeilenumbrüche erlauben.
function formatiere(t) {
  const esc = String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/`(.+?)`/g, "<code>$1</code>")
            .replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>");
}

function zeige() {
  const s = DATA.stunde;
  const id = (location.hash || "").slice(1) || DATA.aufgabe[0].id;
  const a = DATA.aufgabe.find(x => x.id === id) || DATA.aufgabe[0];
  document.getElementById("kopf").textContent = (s.einheit || ("Stunde " + s.nr)) + " · " + s.titel;
  document.getElementById("titel").textContent = a.titel;
  document.title = "Tipps · " + a.titel;

  const box = document.getElementById("stufen");
  box.innerHTML = "";
  const namen = a.stufen || STUFEN;
  a.tipps.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "stufe";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Tipp " + (i + 1) + ": " + (namen[i] || "") + " anzeigen";
    btn.setAttribute("aria-expanded", "false");
    btn.disabled = i > 0;
    const inhalt = document.createElement("div");
    inhalt.className = "inhalt";
    inhalt.hidden = true;
    inhalt.innerHTML = "<p>" + formatiere(t) + "</p>";
    btn.addEventListener("click", () => {
      inhalt.hidden = false;
      btn.setAttribute("aria-expanded", "true");
      btn.textContent = "Tipp " + (i + 1) + ": " + (namen[i] || "");
      const next = box.querySelectorAll(".stufe button")[i + 1];
      if (next) next.disabled = false;
    });
    div.append(btn, inhalt);
    box.append(div);
  });
  if (a.tipps.length === 0) box.innerHTML = '<p class="leer">Zu dieser Aufgabe gibt es keine Tipps.</p>';

  const nav = document.getElementById("nav");
  nav.innerHTML = DATA.aufgabe.length > 1 ? "Andere Aufgaben: " : "";
  if (DATA.aufgabe.length > 1) DATA.aufgabe.forEach(x => {
    const l = document.createElement("a");
    l.href = "#" + x.id;
    l.textContent = x.titel.split(":")[0];
    if (x.id === a.id) l.setAttribute("aria-current", "true");
    nav.append(l);
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", zeige);
zeige();
</script>
</body>
</html>
