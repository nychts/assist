<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tipps</title>
<style>
  :root { --gruen: #2a7a3b; --hell: #eef7f0; --text: #1d1d1d; --grau: #666; --rand: #cfe3d4; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
         background: #fafafa; line-height: 1.5; font-size: 18px; }
  main { max-width: 680px; margin: 0 auto; padding: 16px; }
  header p { margin: 0; color: var(--grau); font-size: 0.85em; }
  h1 { font-size: 1.3em; margin: 4px 0 12px; }
  .hinweis { background: #fff8e6; border-left: 4px solid #e0a800; padding: 8px 12px; border-radius: 4px; font-size: 0.9em; }
  .stufe { background: #fff; border: 1px solid var(--rand); border-radius: 8px; margin: 12px 0; overflow: hidden; }
  .stufe button { width: 100%; text-align: left; padding: 14px 16px; font: inherit; font-weight: 600;
                  border: 0; background: var(--hell); color: var(--gruen); cursor: pointer; min-height: 48px; }
  .stufe button:disabled { color: #999; background: #f1f1f1; cursor: not-allowed; }
  .stufe .inhalt { padding: 4px 16px 14px; }
  .stufe .inhalt[hidden] { display: none; }
  code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 0.92em; }
  nav { margin-top: 28px; font-size: 0.9em; }
  nav a { display: inline-block; margin: 4px 8px 4px 0; padding: 6px 10px; border: 1px solid var(--rand);
          border-radius: 6px; color: var(--gruen); text-decoration: none; background: #fff; }
  nav a[aria-current="true"] { background: var(--gruen); color: #fff; }
  .leer { color: var(--grau); }
</style>
</head>
<body>
<main>
  <header><p id="kopf"></p></header>
  <h1 id="titel">Tipps</h1>
  <p class="hinweis">Probiere es zuerst selbst. Decke die Tipps nacheinander auf und arbeite nach jedem Tipp weiter, bevor du den nächsten öffnest.</p>
  <section id="stufen" aria-live="polite"></section>
  <nav id="nav" aria-label="Andere Aufgaben dieser Stunde"></nav>
</main>
<script>
const DATA = {"stunde":{"fach":"mathematik","reihe":"ma10-quadratische-gleichungen","nr":13,"titel":"Descartes zeichnet Gleichungen"},"aufgabe":[{"id":"a1","titel":"Aufgabe 1: Welche Gleichung gehört zu welcher Geraden?","tipps":["Fahre mit dem Finger von jedem Schnittpunkt senkrecht nach unten zur x-Achse. Welche Zahl liegt dort? Diese Zahl suchst du, nicht die Höhe des Punktes.","Forme jede Gleichung so um, dass links nur x² steht. Aus x² − 3 = 0 wird x² = 3. Die rechte Seite ist die Gerade. Welche Gerade im Bild hat diese Form?","Beispiel mit anderen Zahlen: x² + x = 0 wird zu x² = −x. Die Gerade y = −x geht durch den Ursprung und schneidet die Parabel bei −1 und 0. Also L = {−1; 0}. Probe: (−1)² + (−1) = 0.","Setze die abgelesenen Zahlen in die Gleichung ein. Stimmt die Probe für beide Zahlen, gehört die Gleichung zu dieser Geraden."]},{"id":"a2","titel":"Aufgabe 2: Zeichnen und rechnen","tipps":["Wenn die Gleichung als x² = … dasteht, ist die rechte Seite eine Gerade. Wie sieht die Gerade zu x² = 3x − 1 aus? Welche Zahl steht vor x, welche steht allein?","Zeichnen: Lege den Scheitel der Schablone auf den Ursprung und die gestrichelte Achse auf die y-Achse. Fahre die Kurve nach. Für die Gerade setzt du x = 0 und x = 1 ein und verbindest die zwei Punkte. Rechnen: Bringe die Gleichung auf die Form x² + px + q = 0 und nutze die pq-Formel, Vieta oder das Nullprodukt.","Beispiel mit einer anderen Gleichung: x² − 4x + 3 = 0 wird zu x² = 4x − 3. Die Gerade geht durch (0 | −3) und (1 | 1). Sie schneidet die Parabel bei x = 1 und x = 3. Probe: 1 − 4 + 3 = 0 und 9 − 12 + 3 = 0.","Berührt die Gerade die Parabel nur, gibt es genau eine Lösung. In der Rechnung steht dann unter der Wurzel 0. Weichen Zeichnung und Rechnung voneinander ab, entscheidet die Probe. Die Zeichnung liefert oft nur eine Näherung."]},{"id":"a3","titel":"Aufgabe 3: Stimmt die Zeichnung?","tipps":["Prüfe die Behauptung „keine Lösung“. Probiere ein paar kleine ganze Zahlen in x² − x − 2 = 0 aus. Findest du eine, bei der 0 herauskommt?","Steht eine Lösung fest, steckt der Fehler in der Zeichnung. Forme die Gleichung noch einmal um. Was passiert mit −x und mit −2, wenn sie auf die andere Seite wandern?","Beispiel mit anderen Zahlen: x² − 3x − 4 = 0. Beide Zahlen wandern nach rechts und ändern das Vorzeichen: x² = 3x + 4. Die Gerade heißt y = 3x + 4.","Zeichne die richtige Gerade, lies beide Zahlen ab und prüfe sie in der Ausgangsgleichung. Formuliere dann den Fehler in einem Satz."]}]};
const STUFEN = ["Denkanstoß", "Strategie", "Teillösung", "Kontrolle"];

// Text sicher machen, dann **fett**, `code` und Zeilenumbrüche erlauben.
function formatiere(t) {
  const esc = String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/`(.+?)`/g, "<code>$1</code>")
            .replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>");
}

function zeige() {
  const s = DATA.stunde;
  const id = (location.hash || "").slice(1) || DATA.aufgabe[0].id;
  const a = DATA.aufgabe.find(x => x.id === id) || DATA.aufgabe[0];
  document.getElementById("kopf").textContent = (s.einheit || ("Stunde " + s.nr)) + " · " + s.titel;
  document.getElementById("titel").textContent = a.titel;
  document.title = "Tipps · " + a.titel;

  const box = document.getElementById("stufen");
  box.innerHTML = "";
  const namen = a.stufen || STUFEN;
  a.tipps.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "stufe";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Tipp " + (i + 1) + ": " + (namen[i] || "") + " anzeigen";
    btn.setAttribute("aria-expanded", "false");
    btn.disabled = i > 0;
    const inhalt = document.createElement("div");
    inhalt.className = "inhalt";
    inhalt.hidden = true;
    inhalt.innerHTML = "<p>" + formatiere(t) + "</p>";
    btn.addEventListener("click", () => {
      inhalt.hidden = false;
      btn.setAttribute("aria-expanded", "true");
      btn.textContent = "Tipp " + (i + 1) + ": " + (namen[i] || "");
      const next = box.querySelectorAll(".stufe button")[i + 1];
      if (next) next.disabled = false;
    });
    div.append(btn, inhalt);
    box.append(div);
  });
  if (a.tipps.length === 0) box.innerHTML = '<p class="leer">Zu dieser Aufgabe gibt es keine Tipps.</p>';

  const nav = document.getElementById("nav");
  nav.innerHTML = DATA.aufgabe.length > 1 ? "Andere Aufgaben: " : "";
  if (DATA.aufgabe.length > 1) DATA.aufgabe.forEach(x => {
    const l = document.createElement("a");
    l.href = "#" + x.id;
    l.textContent = x.titel.split(":")[0];
    if (x.id === a.id) l.setAttribute("aria-current", "true");
    nav.append(l);
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", zeige);
zeige();
</script>
</body>
</html>
