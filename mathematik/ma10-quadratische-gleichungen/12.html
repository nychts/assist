<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tipps</title>
<style>
  :root { --gruen: #2a7a3b; --hell: #eef7f0; --text: #1d1d1d; --grau: #666; --rand: #cfe3d4; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
         background: #fafafa; line-height: 1.5; font-size: 18px; }
  main { max-width: 680px; margin: 0 auto; padding: 16px; }
  header p { margin: 0; color: var(--grau); font-size: 0.85em; }
  h1 { font-size: 1.3em; margin: 4px 0 12px; }
  .hinweis { background: #fff8e6; border-left: 4px solid #e0a800; padding: 8px 12px; border-radius: 4px; font-size: 0.9em; }
  .stufe { background: #fff; border: 1px solid var(--rand); border-radius: 8px; margin: 12px 0; overflow: hidden; }
  .stufe button { width: 100%; text-align: left; padding: 14px 16px; font: inherit; font-weight: 600;
                  border: 0; background: var(--hell); color: var(--gruen); cursor: pointer; min-height: 48px; }
  .stufe button:disabled { color: #999; background: #f1f1f1; cursor: not-allowed; }
  .stufe .inhalt { padding: 4px 16px 14px; }
  .stufe .inhalt[hidden] { display: none; }
  code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 0.92em; }
  nav { margin-top: 28px; font-size: 0.9em; }
  nav a { display: inline-block; margin: 4px 8px 4px 0; padding: 6px 10px; border: 1px solid var(--rand);
          border-radius: 6px; color: var(--gruen); text-decoration: none; background: #fff; }
  nav a[aria-current="true"] { background: var(--gruen); color: #fff; }
  .leer { color: var(--grau); }
</style>
</head>
<body>
<main>
  <header><p id="kopf"></p></header>
  <h1 id="titel">Tipps</h1>
  <p class="hinweis">Probiere es zuerst selbst. Decke die Tipps nacheinander auf und arbeite nach jedem Tipp weiter, bevor du den nächsten öffnest.</p>
  <section id="stufen" aria-live="polite"></section>
  <nav id="nav" aria-label="Andere Aufgaben dieser Stunde"></nav>
</main>
<script>
const DATA = {"stunde":{"fach":"mathematik","reihe":"ma10-quadratische-gleichungen","nr":12,"titel":"Codeknacker Viète"},"aufgabe":[{"id":"a1","titel":"Station 1: Zwei Zahlen gesucht","tipps":["Der Satz von Vieta verbindet die Lösungen mit den Zahlen p und q. Welche der beiden Angaben, Summe oder Produkt, gehört zu p und welche zu q? Lies den Satz auf deinem Laufzettel noch einmal und achte auf das Vorzeichen.","Die Summe der Lösungen ist −p, das Produkt ist q. Setze die Summe in −p ein und bestimme p. Schreibe dann x² + p·x + q = 0 mit deinen Zahlen auf. Für die Lösungen suchst du zwei Zahlen mit dem richtigen Produkt und prüfst ihre Summe.","Beispiel mit anderen Zahlen: Summe 9 und Produkt 14. Dann ist −p = 9, also p = −9, und q = 14. Die Gleichung heißt x² − 9x + 14 = 0. Zahlen mit Produkt 14 sind 1 und 14 oder 2 und 7. Nur bei 2 und 7 ist die Summe 9.","Setze beide Zahlen in deine Gleichung ein. Kommt jedes Mal 0 heraus? Deine Ziffer ist die größere der beiden Zahlen."]},{"id":"a2","titel":"Station 2: Raten und Prüfen","tipps":["Hier ist q = −12. Was verrät das Minuszeichen über die beiden Lösungen? Können beide dasselbe Vorzeichen haben, wenn ihr Produkt negativ ist?","Schreibe Zahlenpaare mit Produkt −12 auf: 1 und −12, −1 und 12, 2 und −6, −2 und 6, 3 und −4, −3 und 4. Berechne zu jedem Paar die Summe. In der Gleichung ist p = −1, also muss die Summe der Lösungen 1 sein.","Beispiel mit einer anderen Gleichung: x² + 2x − 8 = 0. Das Produkt ist −8, die Summe ist −2. Die Paare 1 und −8 (Summe −7) und 2 und −4 (Summe −2) liegen nahe. Nur 2 und −4 passen, Probe: 2² + 2·2 − 8 = 0.","Setze beide Zahlen in x² − x − 12 ein. Kommt jedes Mal 0 heraus? Deine Ziffer ist die positive der beiden Lösungen."]},{"id":"a3","titel":"Station 3: Eine Gleichung bauen","tipps":["Der Satz von Vieta lässt sich rückwärts lesen. Du kennst die Lösungen. Was ergibt ihre Summe, was ihr Produkt? Welche Zahlen p und q gehören dazu?","Rechne die Summe und das Produkt der beiden Lösungen aus. Die Summe ist −p, also drehst du das Vorzeichen um, um p zu erhalten. Das Produkt ist q. Schreibe dann x² + p·x + q = 0 auf. Auch (x + 1)(x + 8) auszumultiplizieren führt zum Ziel.","Beispiel mit anderen Lösungen: −2 und 7. Die Summe ist 5, also p = −5. Das Produkt ist −14, also q = −14. Die Gleichung heißt x² − 5x − 14 = 0. Probe mit 7: 49 − 35 − 14 = 0.","Setze −1 und −8 in deine Gleichung ein. Kommt jedes Mal 0 heraus? Deine Ziffer ist die Zahl p."]},{"id":"a4","titel":"Station 4: Der abgefangene Brief","tipps":["Beginne mit der Probe. Setze −2 in x² − 6x + 8 ein. Kommt 0 heraus? Wenn nicht, steckt der Fehler im Brief.","Schau dir die Zeilen (1) bis (3) im Brief nacheinander an. In Zeile (2) wird die Summe der Lösungen festgelegt. Was sagt der Satz von Vieta zur Summe, wenn p = −6 ist?","Beispiel mit einer anderen Gleichung: x² − 9x + 14 = 0 hat p = −9. Die Summe der Lösungen ist dann +9, das Produkt ist 14. Die Zahlen 2 und 7 passen zu beiden Angaben.","Rechne die Probe mit deinen beiden neuen Lösungen. Deine Ziffer ist die Summe dieser beiden Lösungen."]}]};
const STUFEN = ["Denkanstoß", "Strategie", "Teillösung", "Kontrolle"];

// Text sicher machen, dann **fett**, `code` und Zeilenumbrüche erlauben.
function formatiere(t) {
  const esc = String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/`(.+?)`/g, "<code>$1</code>")
            .replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>");
}

function zeige() {
  const s = DATA.stunde;
  const id = (location.hash || "").slice(1) || DATA.aufgabe[0].id;
  const a = DATA.aufgabe.find(x => x.id === id) || DATA.aufgabe[0];
  document.getElementById("kopf").textContent = (s.einheit || ("Stunde " + s.nr)) + " · " + s.titel;
  document.getElementById("titel").textContent = a.titel;
  document.title = "Tipps · " + a.titel;

  const box = document.getElementById("stufen");
  box.innerHTML = "";
  const namen = a.stufen || STUFEN;
  a.tipps.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "stufe";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Tipp " + (i + 1) + ": " + (namen[i] || "") + " anzeigen";
    btn.setAttribute("aria-expanded", "false");
    btn.disabled = i > 0;
    const inhalt = document.createElement("div");
    inhalt.className = "inhalt";
    inhalt.hidden = true;
    inhalt.innerHTML = "<p>" + formatiere(t) + "</p>";
    btn.addEventListener("click", () => {
      inhalt.hidden = false;
      btn.setAttribute("aria-expanded", "true");
      btn.textContent = "Tipp " + (i + 1) + ": " + (namen[i] || "");
      const next = box.querySelectorAll(".stufe button")[i + 1];
      if (next) next.disabled = false;
    });
    div.append(btn, inhalt);
    box.append(div);
  });
  if (a.tipps.length === 0) box.innerHTML = '<p class="leer">Zu dieser Aufgabe gibt es keine Tipps.</p>';

  const nav = document.getElementById("nav");
  nav.innerHTML = DATA.aufgabe.length > 1 ? "Andere Aufgaben: " : "";
  if (DATA.aufgabe.length > 1) DATA.aufgabe.forEach(x => {
    const l = document.createElement("a");
    l.href = "#" + x.id;
    l.textContent = x.titel.split(":")[0];
    if (x.id === a.id) l.setAttribute("aria-current", "true");
    nav.append(l);
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", zeige);
zeige();
</script>
</body>
</html>
