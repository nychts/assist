<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tipps</title>
<style>
  :root { --gruen: #2a7a3b; --hell: #eef7f0; --text: #1d1d1d; --grau: #666; --rand: #cfe3d4; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
         background: #fafafa; line-height: 1.5; font-size: 18px; }
  main { max-width: 680px; margin: 0 auto; padding: 16px; }
  header p { margin: 0; color: var(--grau); font-size: 0.85em; }
  h1 { font-size: 1.3em; margin: 4px 0 12px; }
  .hinweis { background: #fff8e6; border-left: 4px solid #e0a800; padding: 8px 12px; border-radius: 4px; font-size: 0.9em; }
  .stufe { background: #fff; border: 1px solid var(--rand); border-radius: 8px; margin: 12px 0; overflow: hidden; }
  .stufe button { width: 100%; text-align: left; padding: 14px 16px; font: inherit; font-weight: 600;
                  border: 0; background: var(--hell); color: var(--gruen); cursor: pointer; min-height: 48px; }
  .stufe button:disabled { color: #999; background: #f1f1f1; cursor: not-allowed; }
  .stufe .inhalt { padding: 4px 16px 14px; }
  .stufe .inhalt[hidden] { display: none; }
  code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 0.92em; }
  nav { margin-top: 28px; font-size: 0.9em; }
  nav a { display: inline-block; margin: 4px 8px 4px 0; padding: 6px 10px; border: 1px solid var(--rand);
          border-radius: 6px; color: var(--gruen); text-decoration: none; background: #fff; }
  nav a[aria-current="true"] { background: var(--gruen); color: #fff; }
  .leer { color: var(--grau); }
</style>
</head>
<body>
<main>
  <header><p id="kopf"></p></header>
  <h1 id="titel">Tipps</h1>
  <p class="hinweis">Probiere es zuerst selbst. Decke die Tipps nacheinander auf und arbeite nach jedem Tipp weiter, bevor du den nächsten öffnest.</p>
  <section id="stufen" aria-live="polite"></section>
  <nav id="nav" aria-label="Andere Aufgaben dieser Stunde"></nav>
</main>
<script>
const DATA = {"stunde":{"fach":"mathematik","reihe":"ma10-quadratische-gleichungen","nr":10,"titel":"Das Duell von Venedig"},"aufgabe":[{"id":"a1","titel":"Aufgabe 1: Die Bauwerkstatt","tipps":["Beim Bauen gehst du rückwärts: Du kennst die Lösung vorher und suchst die Gleichung. Welche Zahl in x² + px + q = 0 musst du am Ende ausrechnen, und welche darfst du frei wählen?","Lege eine Lösung fest und wähle p. Setze die Lösung für x ein. Dann steht in der Gleichung nur noch q als Unbekannte, und du löst nach q auf. Bei Karte B und C legst du q über die Zahl unter der Wurzel fest: Für genau eine Lösung muss (p/2)² − q gleich 0 sein, für keine Lösung kleiner als 0.","Beispiel mit einer anderen Vorgabe: Eine Lösung soll 5 sein, und du wählst p = −7. Einsetzen: 25 − 35 + q = 0, also q = 10. Die Gleichung ist x² − 7x + 10 = 0. Mit der pq-Formel: x = 3,5 ± 1,5, also 5 und 2.","Löse deine fertige Gleichung mit der pq-Formel. Kommt die festgelegte Lösung heraus? Erfüllt die Gleichung die Karte? Wenn nicht, prüfe zuerst das Vorzeichen von q beim Einsetzen. Bei Karte E: Baue erst eine Gleichung ohne Zahl vor x² und multipliziere dann jeden Summanden mit derselben Zahl."]},{"id":"a2","titel":"Aufgabe 2: Das Duell","tipps":["Schau auf die Zahl vor x². Steht dort mehr als ein x², dann ist die Gleichung noch nicht in Normalform. Was musst du zuerst mit der ganzen Gleichung tun?","Rechne immer in derselben Reihenfolge und schreibe jeden Schritt in eine eigene Zeile: Normalform, p und q mit Vorzeichen, −p/2, Zahl unter der Wurzel, zwei Lösungen, Probe. Ist eine Lösung negativ, schreibst du den Antrag auf Zulassung als Probe in einer Zeile.","Beispiel mit anderen Zahlen: x² + 6x − 7 = 0 hat p = 6 und q = −7. Es ist −p/2 = −3 und unter der Wurzel 9 − (−7) = 16. Also x = −3 ± 4, das sind 1 und −7. Probe: 1 + 6 − 7 = 0 und 49 − 42 − 7 = 0.","Wird die Zahl unter der Wurzel negativ, hat die Gleichung keine Lösung. Schreibe dann die Rechnung mit D und L = { }. Die Probe entfällt. Ob die Gleichung die Karte erfüllt, siehst du am Wert von D: zwei Lösungen D > 0, eine Lösung D = 0, keine Lösung D < 0."]},{"id":"a3","titel":"Aufgabe 3: Kontrolle und Punkte","tipps":["Eure Lösungen weichen ab. Wie könnt ihr entscheiden, wer recht hat, ohne dass einer nachgibt?","Setzt die strittige Lösung in die Gleichung ein. Kommt auf beiden Seiten dasselbe heraus, stimmt sie. Sucht dann in der anderen Rechnung die erste Zeile, die nicht zur Probe passt. Meistens steckt dort ein Vorzeichen oder eine vergessene Division durch die Zahl vor x².","Punkte: 2 für jede fremde Aufgabe, die ihr richtig und mit Probe gelöst habt, 1 für jede eigene Aufgabe, die die Karte erfüllt und deren Lösungszettel stimmt. Mehr als 9 Punkte gibt es nicht. Eine negative Lösung zählt nur mit Antrag auf Zulassung."]}]};
const STUFEN = ["Denkanstoß", "Strategie", "Teillösung", "Kontrolle"];

// Text sicher machen, dann **fett**, `code` und Zeilenumbrüche erlauben.
function formatiere(t) {
  const esc = String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/`(.+?)`/g, "<code>$1</code>")
            .replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>");
}

function zeige() {
  const s = DATA.stunde;
  const id = (location.hash || "").slice(1) || DATA.aufgabe[0].id;
  const a = DATA.aufgabe.find(x => x.id === id) || DATA.aufgabe[0];
  document.getElementById("kopf").textContent = (s.einheit || ("Stunde " + s.nr)) + " · " + s.titel;
  document.getElementById("titel").textContent = a.titel;
  document.title = "Tipps · " + a.titel;

  const box = document.getElementById("stufen");
  box.innerHTML = "";
  const namen = a.stufen || STUFEN;
  a.tipps.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "stufe";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Tipp " + (i + 1) + ": " + (namen[i] || "") + " anzeigen";
    btn.setAttribute("aria-expanded", "false");
    btn.disabled = i > 0;
    const inhalt = document.createElement("div");
    inhalt.className = "inhalt";
    inhalt.hidden = true;
    inhalt.innerHTML = "<p>" + formatiere(t) + "</p>";
    btn.addEventListener("click", () => {
      inhalt.hidden = false;
      btn.setAttribute("aria-expanded", "true");
      btn.textContent = "Tipp " + (i + 1) + ": " + (namen[i] || "");
      const next = box.querySelectorAll(".stufe button")[i + 1];
      if (next) next.disabled = false;
    });
    div.append(btn, inhalt);
    box.append(div);
  });
  if (a.tipps.length === 0) box.innerHTML = '<p class="leer">Zu dieser Aufgabe gibt es keine Tipps.</p>';

  const nav = document.getElementById("nav");
  nav.innerHTML = DATA.aufgabe.length > 1 ? "Andere Aufgaben: " : "";
  if (DATA.aufgabe.length > 1) DATA.aufgabe.forEach(x => {
    const l = document.createElement("a");
    l.href = "#" + x.id;
    l.textContent = x.titel.split(":")[0];
    if (x.id === a.id) l.setAttribute("aria-current", "true");
    nav.append(l);
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", zeige);
zeige();
</script>
</body>
</html>
