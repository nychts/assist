<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tipps</title>
<style>
  :root { --gruen: #2a7a3b; --hell: #eef7f0; --text: #1d1d1d; --grau: #666; --rand: #cfe3d4; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text);
         background: #fafafa; line-height: 1.5; font-size: 18px; }
  main { max-width: 680px; margin: 0 auto; padding: 16px; }
  header p { margin: 0; color: var(--grau); font-size: 0.85em; }
  h1 { font-size: 1.3em; margin: 4px 0 12px; }
  .hinweis { background: #fff8e6; border-left: 4px solid #e0a800; padding: 8px 12px; border-radius: 4px; font-size: 0.9em; }
  .stufe { background: #fff; border: 1px solid var(--rand); border-radius: 8px; margin: 12px 0; overflow: hidden; }
  .stufe button { width: 100%; text-align: left; padding: 14px 16px; font: inherit; font-weight: 600;
                  border: 0; background: var(--hell); color: var(--gruen); cursor: pointer; min-height: 48px; }
  .stufe button:disabled { color: #999; background: #f1f1f1; cursor: not-allowed; }
  .stufe .inhalt { padding: 4px 16px 14px; }
  .stufe .inhalt[hidden] { display: none; }
  code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 0.92em; }
  nav { margin-top: 28px; font-size: 0.9em; }
  nav a { display: inline-block; margin: 4px 8px 4px 0; padding: 6px 10px; border: 1px solid var(--rand);
          border-radius: 6px; color: var(--gruen); text-decoration: none; background: #fff; }
  nav a[aria-current="true"] { background: var(--gruen); color: #fff; }
  .leer { color: var(--grau); }
</style>
</head>
<body>
<main>
  <header><p id="kopf"></p></header>
  <h1 id="titel">Tipps</h1>
  <p class="hinweis">Probiere es zuerst selbst. Decke die Tipps nacheinander auf und arbeite nach jedem Tipp weiter, bevor du den nächsten öffnest.</p>
  <section id="stufen" aria-live="polite"></section>
  <nav id="nav" aria-label="Andere Aufgaben dieser Stunde"></nav>
</main>
<script>
const DATA = {"stunde":{"fach":"mathematik","reihe":"ma10-quadratische-gleichungen","nr":9,"titel":"Cardanos unmögliche Aufgabe"},"aufgabe":[{"id":"a1","titel":"Aufgabe 1: Wette am Regler","tipps":["Die Parabel y = x² − 10x + q ist eine Normalparabel, die verschoben wurde. Überlege vor jedem Tipp, ob die Parabel mit größerem q nach oben oder nach unten wandert. Was passiert dann mit den Schnittpunkten mit der x-Achse?","Zähle die Schnittpunkte mit der x-Achse. Zwei Schnittpunkte sind zwei Nullstellen. Berührt die Parabel die Achse nur in einem Punkt, ist es eine Nullstelle. Gibt es keinen Schnittpunkt, sind es null.","Beispiel mit einem q, das nicht in der Tabelle steht. Für q = 0 ist y = x² − 10x = x · (x − 10). Die Parabel schneidet die Achse bei 0 und bei 10, also gibt es zwei Nullstellen."]},{"id":"a2","titel":"Aufgabe 2: Die Regel vermuten","tipps":["Schau in die Spalte „Nullstellen laut Widget“ und lies sie von oben nach unten. Wo ändert sich die Zahl?","Die Zeile mit genau einer Nullstelle liegt zwischen den beiden anderen Bereichen. Welches q gehört zu dieser Zeile? Mit dieser Zahl füllst du alle Lücken.","Für Teil b: Die Scheitelpunktform y = (x − d)² + e hat den Scheitelpunkt S(d | e). Bei y = (x − 5)² + 3 ist das S(5 | 3), denn x − 5 = 0 gilt für x = 5.","Die Parabel ist nach oben geöffnet, der Scheitelpunkt ist ihr tiefster Punkt. Liegt er über der x-Achse, liegt die ganze Parabel darüber. Setze q = 29 in q − 25 ein und sieh nach, ob y positiv ist."],"stufen":["Denkanstoß","Strategie","Denkanstoß zu Teil b","Teillösung zu Teil b"]},{"id":"a3","titel":"Aufgabe 3: Die Zahl unter der Wurzel","tipps":["p ist die Zahl vor dem x, mit ihrem Vorzeichen. Hier steht −10 vor dem x. Was ist die Hälfte davon? Achte auf das Minuszeichen.","Die Hälfte von −10 ist −5, und (−5)² ist 25. Das gilt für alle Zeilen der Tabelle, nur q ändert sich. Du rechnest also in jeder Zeile 25 minus q.","Beispiel mit q = 0, das nicht in der Tabelle steht. Es ist D = 25 − 0 = 25. Das ist größer als 0, und die Parabel y = x² − 10x hat zwei Nullstellen.","Wird q größer, wird D kleiner. In der Zeile mit D = 0 muss der Widget-Wert genau eine Nullstelle zeigen."]}]};
const STUFEN = ["Denkanstoß", "Strategie", "Teillösung", "Kontrolle"];

// Text sicher machen, dann **fett**, `code` und Zeilenumbrüche erlauben.
function formatiere(t) {
  const esc = String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
            .replace(/`(.+?)`/g, "<code>$1</code>")
            .replace(/\n\n/g, "</p><p>").replace(/\n/g, "<br>");
}

function zeige() {
  const s = DATA.stunde;
  const id = (location.hash || "").slice(1) || DATA.aufgabe[0].id;
  const a = DATA.aufgabe.find(x => x.id === id) || DATA.aufgabe[0];
  document.getElementById("kopf").textContent = (s.einheit || ("Stunde " + s.nr)) + " · " + s.titel;
  document.getElementById("titel").textContent = a.titel;
  document.title = "Tipps · " + a.titel;

  const box = document.getElementById("stufen");
  box.innerHTML = "";
  const namen = a.stufen || STUFEN;
  a.tipps.forEach((t, i) => {
    const div = document.createElement("div");
    div.className = "stufe";
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "Tipp " + (i + 1) + ": " + (namen[i] || "") + " anzeigen";
    btn.setAttribute("aria-expanded", "false");
    btn.disabled = i > 0;
    const inhalt = document.createElement("div");
    inhalt.className = "inhalt";
    inhalt.hidden = true;
    inhalt.innerHTML = "<p>" + formatiere(t) + "</p>";
    btn.addEventListener("click", () => {
      inhalt.hidden = false;
      btn.setAttribute("aria-expanded", "true");
      btn.textContent = "Tipp " + (i + 1) + ": " + (namen[i] || "");
      const next = box.querySelectorAll(".stufe button")[i + 1];
      if (next) next.disabled = false;
    });
    div.append(btn, inhalt);
    box.append(div);
  });
  if (a.tipps.length === 0) box.innerHTML = '<p class="leer">Zu dieser Aufgabe gibt es keine Tipps.</p>';

  const nav = document.getElementById("nav");
  nav.innerHTML = DATA.aufgabe.length > 1 ? "Andere Aufgaben: " : "";
  if (DATA.aufgabe.length > 1) DATA.aufgabe.forEach(x => {
    const l = document.createElement("a");
    l.href = "#" + x.id;
    l.textContent = x.titel.split(":")[0];
    if (x.id === a.id) l.setAttribute("aria-current", "true");
    nav.append(l);
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", zeige);
zeige();
</script>
</body>
</html>
